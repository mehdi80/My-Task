<div class="container">
  <table class="table mt-4 table-success table-striped">
    <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">First</th>
      <th scope="col">Last</th>
      <th scope="col">Handle</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users">
      <th scope="row">{{ user.id }}</th>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td><a class="btn btn-primary m-2" routerLink="{{user.id}}">User Detail</a></td>
    </tr>
    </tbody>
  </table>
</div>
